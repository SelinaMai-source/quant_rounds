- experiment_id: P1_BASE_A099
  paper_id: P01_NARDARI_2024
  paper_method: equation (7) power utility, gamma=3, alpha=0.99
  algorithm_equations: w=argmax sum_s alpha^(t-1-s) * ((w'R_s)^(1-gamma)-1)/(1-gamma),
    sum w=1, w>=0
  original_implementation: METHOD_REPLICATION_ON_NEW_DATA
  v5_adaptation: P1_ADAPT_V5
  input_features: historical complete-rule daily net returns only
  training_objective: discounted power utility
  hyperparameters:
    gamma: 3
    alpha: 0.99
    min_months: 12
  seed: 17
  train_window: all rule months strictly before year Y
  validation_window: Y-1 H1 and Y-1 H2 are not used to pick alpha
  test_window: calendar year Y inside 2018-01-02..2026-07-24
  fallback_policy: v5
  data_dependencies: frozen rule ledgers
  cost_contract: ROUND7_FLAT unchanged
  statistical_family: paired daily net versus v5
  primary_metric: sharpe
  secondary_metrics:
  - cagr
  - maxdd
  - ulcer
  stop_conditions: do not add alpha grid points after results
